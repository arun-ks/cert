           //var redirectBase = "index.html?id=";
           //var redirectBase = "./?id=" ;       // This does not work on offline/local file
           const redirectBase = window.location.href.split("?")[0] + "?id=";

           // Function to find and redirect based on certShortName
           function redirectToCert(id) {
              const key = decodeURIComponent(id).toLowerCase();
              const certIndex = Object.create(null);
              certificates.forEach(c => {  certIndex[c.certShortName.toLowerCase()] = c.certURL; });
              const url = certIndex[key];

              if (url) {
                window.location.replace(url);
              } else {   //If wrong ID was passed. TODO: We need to find a way to track & trace such incorrect use.
                displayCertificateList();
              }
           }

           // Function to display the certificate list as a table. This is used when incorrect or no parameter is passed
           function displayCertificateList() {
             let html = `
             <div class="ambient ambient-one"></div>
             <div class="ambient ambient-two"></div>
             <header class="site-header">
               <a class="brand" href="https://arun-ks.github.io/" aria-label="Return to Arun K Sivanandan portfolio">
                 <span>AKS</span><strong>Arun K Sivanandan</strong>
               </a>
               <div class="header-actions">
                 <a class="back-link" href="https://arun-ks.github.io/#credentials">Back to portfolio <span aria-hidden="true">&#8599;</span></a>
                 <button class="theme-toggle" type="button" aria-label="Switch colour theme" onclick="toggleTheme()">
                   <span class="sun" aria-hidden="true">&#9728;</span><span class="moon" aria-hidden="true">&#9790;</span>
                 </button>
               </div>
             </header>
             <main class="container">
               <section class="catalogue-heading">
                 <p class="eyebrow">07 — Credentials &amp; toolkit</p>
                 <h1>Certificate <span>catalogue.</span></h1>
                 <p class="subtitle">A searchable record of professional qualifications, technical training, and continuous learning.</p>
               </section>

               <section class="catalogue-panel" aria-label="Certificate catalogue">
                 <label class="filter-label" for="certFilter">Search certificates</label>
                 <input id="certFilter" type="search" placeholder="Filter by group, name or issuer…" oninput="filterTable()">
                 <div class="table-wrap">
                   <table id="certTable">
                 <thead> <tr> <th>#</th> <th>Group</th> <th>Certificate</th> <th>Issuer</th> <th>Date</th> <th>ShortName</th> </tr></thead>
                 <tbody>`;

             certificates.forEach((c, i) => {
               html += `
                 <tr>
                   <td data-label="#">${i + 1}</td>
                   <td data-label="Group" class="group">${c.certGroup}</td>
                   <td data-label="Name"><a href="${c.certURL}">${c.certName}</a></td>
                   <td data-label="Issuer">${c.certIssuer}</td>
                   <td data-label="Date" class="date">${c.certDate}</td>
                   <td data-label="Certificate"> <a href="${redirectBase}${encodeURIComponent(c.certShortName)}">${c.certShortName}</a></td>
                 </tr>`;
             });

             html += `
                 </tbody>
                   </table>
                 </div>
               </section>

               <footer>
                 <span>Certificate links are maintained in a dedicated catalogue.</span>
                 <a href="https://github.com/arun-ks/cert/">View source <span aria-hidden="true">&#8599;</span></a>
               </footer>
             </main>`;

             document.body.innerHTML = html;
           }

           function filterTable() {
             const q = document.getElementById("certFilter").value.toLowerCase();
             const rows = document.querySelectorAll("#certTable tbody tr");

             rows.forEach(row => {
               const group    = row.children[1].innerText.toLowerCase();
               const certName = row.children[2].innerText.toLowerCase();
               const issuer   = row.children[3].innerText.toLowerCase();
               row.style.display =  group.includes(q) || issuer.includes(q) || certName.includes(q)      ? ""   : "none";
             });
           }

           function toggleTheme() {
             const nextTheme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
             document.documentElement.dataset.theme = nextTheme;
             localStorage.setItem("aks-theme", nextTheme);
           }

           const params = new URLSearchParams(window.location.search);
           const certShortNameParam = params.get("id");

           if (certShortNameParam) {
             redirectToCert(certShortNameParam);
           } else {
           	//Oops, somebody discovered this page & reached it without the short code
             displayCertificateList();
           }

   </script>
